# ── AXON-RYZR — full stack orchestration ──
# Isolated project namespace so it never collides with other apps (e.g. ComputeHub).
# Every container/volume/network is prefixed 'axon-ryzr' and uses a distinct port range.
# Usage: cp .env.example .env && docker compose up -d --build

name: axon-ryzr

services:
  postgres:
    image: postgres:16-alpine
    container_name: axon-ryzr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-axon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-axon} -d ${POSTGRES_DB:-axon_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [axon-net]

  redis:
    image: redis:7-alpine
    container_name: axon-ryzr-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD} --no-auth-warning} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [axon-net]

  minio:
    image: minio/minio:latest
    container_name: axon-ryzr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9200}:9000'
      - '${MINIO_CONSOLE_PORT:-9201}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [axon-net]

  # Creates the assets bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-axon-assets};
      exit 0;
      "
    networks: [axon-net]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axon-ryzr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      API_GLOBAL_PREFIX: api
      WEB_URL: ${WEB_URL:-http://localhost:3200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3200}
      DATABASE_URL: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-axon_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-axon-assets}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://127.0.0.1:8188}
      COMFYUI_DEFAULT_CHECKPOINT: ${COMFYUI_DEFAULT_CHECKPOINT:-sd_xl_base_1.0.safetensors}
      COMFYUI_MOTION_MODULE: ${COMFYUI_MOTION_MODULE:-mm_sd_v15_v2.ckpt}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a strong secret in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a strong secret in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
    ports:
      - '${API_PORT:-4200}:4000'
    networks: [axon-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4200}
    container_name: axon-ryzr-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4200}
    ports:
      - '${WEB_PORT:-3200}:3000'
    networks: [axon-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: axon-ryzr-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${HTTP_PORT:-8200}:80'
    networks: [axon-net]

volumes:
  postgres_data:
    name: axon_ryzr_postgres_data
  redis_data:
    name: axon_ryzr_redis_data
  minio_data:
    name: axon_ryzr_minio_data

networks:
  axon-net:
    name: axon-ryzr-net
    driver: bridge

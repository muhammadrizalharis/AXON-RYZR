# ── AXON-RYZR — INFRA-ONLY untuk DEVELOPMENT ──
# Menyalakan HANYA dependency: PostgreSQL + Redis + MinIO (TANPA api/web/nginx).
# Backend dijalankan di host dengan hot-reload: `cd backend && npm run start:dev`.
# Namespace 'axon-ryzr-dev' + volume/port khusus -> TIDAK bentrok dengan stack
# produksi (axon-ryzr) maupun layanan lain di server.
#
# Pakai (butuh akses Docker; bila belum di group docker, awali dengan `sudo`):
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#
# TANPA Docker / TANPA sudo -> pakai: backend/scripts/dev-services.sh up

name: axon-ryzr-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: axon-ryzr-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-axon_db}
    ports:
      - '${DEV_PG_PORT:-55432}:5432'
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-axon} -d ${POSTGRES_DB:-axon_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: axon-ryzr-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${DEV_REDIS_PORT:-56379}:6379'
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: axon-ryzr-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-axon-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-axon-minio-dev}
    ports:
      - '${DEV_MINIO_PORT:-59000}:9000'
      - '${DEV_MINIO_CONSOLE_PORT:-59001}:9001'
    volumes:
      - dev_minio_data:/data

  # Membuat bucket aset pada boot pertama.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-axon-minio} ${MINIO_SECRET_KEY:-axon-minio-dev};
      mc mb --ignore-existing local/${MINIO_BUCKET:-axon-assets};
      exit 0;
      "

volumes:
  dev_postgres_data:
    name: axon_ryzr_dev_postgres_data
  dev_redis_data:
    name: axon_ryzr_dev_redis_data
  dev_minio_data:
    name: axon_ryzr_dev_minio_data
